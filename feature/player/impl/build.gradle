plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.21'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.tsutsen.platformplayer.feature.player.impl'
    compileSdk 36

    defaultConfig {
        minSdk 28
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        compose true
    }

    sourceSets {
        main {
            java.srcDirs += "${buildDir}/generated/src"
        }
    }
}

// Generate GestureSpecResource.kt from spec/gestures.yaml
tasks.register('generateGestureSpec') {
    def yamlFile = file('../spec/gestures.yaml')
    def outputFile = file("${buildDir}/generated/src/com/tsutsen/platformplayer/feature/player/impl/GestureSpecResource.kt")

    inputs.file(yamlFile)
    outputs.file(outputFile)

    doLast {
        outputFile.parentFile.mkdirs()
        def yamlContent = yamlFile.text
        // Escape backslashes, dollar signs, and quotes for Kotlin string
        def escaped = yamlContent
            .replace('\\', '\\\\')
            .replace('$', '\\$')
            .replace('"', '\\"')

        def kt = "package com.tsutsen.platformplayer.feature.player.impl\n"
        kt += "\n"
        kt += "/** Auto-generated from spec/gestures.yaml — do not edit */\n"
        kt += "object GestureSpecResource {\n"
        kt += "    @JvmField\n"
        kt += "    val YAML = \"\"\"\n"
        kt += escaped
        kt += "\"\"\"\n"
        kt += "}\n"
        outputFile.text = kt
    }
}

// Wire generation into compile tasks for library module
afterEvaluate {
    tasks.named('compileDebugKotlin').configure { dependsOn('generateGestureSpec') }
    tasks.named('compileReleaseKotlin').configure { dependsOn('generateGestureSpec') }
    tasks.named('kspDebugKotlin').configure { dependsOn('generateGestureSpec') }
    tasks.named('kspReleaseKotlin').configure { dependsOn('generateGestureSpec') }
}

dependencies {
    implementation project(':core:designsystem')
    implementation project(':core:data')
    implementation project(':core:navigation')
    implementation project(':core:model')
    implementation project(':core:ui')
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation platform('androidx.compose:compose-bom:2025.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3.adaptive:adaptive'
    implementation 'androidx.compose.material3.adaptive:adaptive-layout'
    implementation 'androidx.compose.material3.adaptive:adaptive-navigation'
    implementation 'androidx.media3:media3-exoplayer:1.9.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.9.0'
    implementation 'androidx.media3:media3-ui-compose:1.9.0'
    implementation 'androidx.media3:media3-ui:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose'
    implementation 'androidx.activity:activity-compose'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    
    // Coil for image loading
    implementation 'io.coil-kt:coil-compose:2.7.0'
    
    // Hilt
    implementation 'com.google.dagger:hilt-android:2.58'
    ksp 'com.google.dagger:hilt-android-compiler:2.58'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
}
