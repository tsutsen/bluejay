plugins {
    id 'com.android.test'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tsutsen.platformplayer.benchmark'
    compileSdk 36

    // Mirror the app's flavor dimension so variant matching works
    flavorDimensions 'buildType'
    productFlavors {
        stable { dimension 'buildType' }
        unstable { dimension 'buildType' }
        playstore { dimension 'buildType' }
    }

    defaultConfig {
        minSdk 28
        targetSdk 36
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }



    // Benchmarks run against the app's `benchmark` build type (see app/build.gradle).
    targetProjectPath = ':app'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.benchmark:benchmark-macro-junit4:1.3.4'
    implementation 'androidx.test.ext:junit:1.2.1'
    implementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
