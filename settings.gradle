pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

includeBuild('dep/polycentricandroid') {
    dependencySubstitution {
        substitute module('com.polycentric.core:app') using project(':app')
    }
}

includeBuild('dep/futopay/android') {
    dependencySubstitution {
        substitute module('com.tsutsen.futopay:app') using project(':app')
    }
}

rootProject.name = "FutoVideo"
include ':app'

// Core modules
include ':core:model'
include ':core:data'
include ':core:datastore'
include ':core:database'
include ':core:designsystem'
include ':core:navigation'
include ':core:ui'

// Feature modules
include ':feature:dualscreen'
include ':feature:home:impl'
include ':feature:search:impl'
include ':feature:player:impl'
include ':feature:library:impl'
include ':feature:channel:impl'
include ':feature:subscriptions:impl'
include ':feature:settings:impl'
