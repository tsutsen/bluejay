ext {
    // Version = latest semver tag in the repo (the release log) + distance
    // from it. Release tags live on master and are NOT ancestors of dev
    // branches, so plain `git describe` would report v0.1.0 (the only tag
    // reachable from dev) even after 0.3.0 shipped.
    def git = { String cmd -> cmd.execute(null, rootProject.projectDir).text.trim() }
    def tagList = git('git tag --sort=-v:refname').readLines()
    def latestTag = (tagList && tagList[0].matches(/v\d+\.\d+\.\d+/)) ? tagList[0] : ''
    if (latestTag.isEmpty()) {
        gitVersionName = 'unversioned'
    } else {
        def count = git("git rev-list --count ${latestTag}..HEAD").toInteger()
        gitVersionName = count > 0 ? "${latestTag}-${count}-g${git('git rev-parse --short HEAD')}" : latestTag
    }
    // Semver tags (v0.1.0) → store versionCode via major*1e6 + minor*1e3 + patch,
    // so 0.1.0 → 1000 (above legacy's max 389, keeps store updates monotonic).
    // Unparseable (e.g. no tag yet) falls back to 1.
    def semver = (gitVersionName ?: '').replaceAll(/^v/, '').split('-')[0].split('\\.')
    gitVersionCode = (semver.length == 3 && semver.every { it.isInteger() }) ?
        semver[0].toInteger() * 1_000_000 + semver[1].toInteger() * 1_000 + semver[2].toInteger() : 1
}

println("Version Name: $gitVersionName")
println("Version Code: $gitVersionCode")

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('/opt/key.properties')
if (!keystorePropertiesFile.exists()) keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

protobuf {
    protoc {
        // TODO: pin via gradle/libs.versions.toml [versions] protoc = "3.25.1"
        // once this artifact notation moves to the version catalog
        // (e.g. artifact = libs.google.protoc) — verify protobuf-gradle-plugin
        // accepts the catalog Provider in Groovy DSL before switching.
        artifact = 'com.google.protobuf:protoc:3.25.1'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option "lite"
                }
            }
        }
    }
}

android {
    namespace 'com.tsutsen.platformplayer'
    compileSdk 37
    flavorDimensions "buildType"
    productFlavors {
        stable {
            dimension "buildType"
            applicationId "com.tsutsen.platformplayer"
            buildConfigField "boolean", "IS_UNSTABLE_BUILD", "false"
            buildConfigField "boolean", "IS_PLAYSTORE_BUILD", "false"
            resValue "string", "app_name", "Bluejay"
            resValue "string", "authority", "com.tsutsen.platformplayer"
        }
        unstable {
            dimension "buildType"
            applicationId "com.tsutsen.platformplayer.d"
            buildConfigField "boolean", "IS_UNSTABLE_BUILD", "true"
            buildConfigField "boolean", "IS_PLAYSTORE_BUILD", "false"
            resValue "string", "app_name", "Bluejay"
            resValue "string", "authority", "com.tsutsen.platformplayer.d"
            getIsDefault().set(true)
        }
        playstore {
            dimension "buildType"
            applicationId "com.tsutsen.platformplayer.playstore"
            buildConfigField "boolean", "IS_UNSTABLE_BUILD", "false"
            buildConfigField "boolean", "IS_PLAYSTORE_BUILD", "true"
            resValue "string", "app_name", "Bluejay"
            resValue "string", "authority", "com.tsutsen.platformplayer.playstore"
        }
    }

    defaultConfig {
        minSdk 28
        targetSdk 36
        versionCode gitVersionCode
        versionName gitVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? rootProject.file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        // Macrobenchmark target: release code + debuggable so benchmark can drive it
        benchmark {
            initWith release
            signingConfig signingConfigs.release
            debuggable true
            matchingFallbacks += ['release']
        }
        release {
            signingConfig signingConfigs.release
            // Shrink only, no obfuscation yet: -dontobfuscate keeps names for
            // kotlin-reflect (JSClient @JSDocs bridge) and crash readability.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
        }
    }

    splits {
        abi {
            enable true
            reset()

            include "arm64-v8a"
            universalApk true
        }
    }
    lint {
        // lintVital misfires on this inherited manifest (7k false Instantiatable errors)
        checkReleaseBuilds false
    }

    buildFeatures {
        buildConfig true
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets {
                srcDirs 'src/main/assets'
            }
        }
    }
}

