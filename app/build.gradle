plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.0'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.0'
    id 'com.google.protobuf'
    id 'com.google.dagger.hilt.android' version '2.60.1'
    id 'com.google.devtools.ksp'
}

ext {
    // Version = latest semver tag in the repo (the release log) + distance
    // from it. Release tags live on master and are NOT ancestors of dev
    // branches, so plain `git describe` would report v0.1.0 (the only tag
    // reachable from dev) even after 0.3.0 shipped.
    def git = { String cmd -> cmd.execute(null, rootProject.projectDir).text.trim() }
    def tagList = git('git tag --sort=-v:refname').readLines()
    def latestTag = (tagList && tagList[0].matches(/v\d+\.\d+\.\d+/)) ? tagList[0] : ''
    if (latestTag.isEmpty()) {
        gitVersionName = 'unversioned'
    } else {
        def count = git("git rev-list --count ${latestTag}..HEAD").toInteger()
        gitVersionName = count > 0 ? "${latestTag}-${count}-g${git('git rev-parse --short HEAD')}" : latestTag
    }
    // Semver tags (v0.1.0) → store versionCode via major*1e6 + minor*1e3 + patch,
    // so 0.1.0 → 1000 (above legacy's max 389, keeps store updates monotonic).
    // Unparseable (e.g. no tag yet) falls back to 1.
    def semver = (gitVersionName ?: '').replaceAll(/^v/, '').split('-')[0].split('\\.')
    gitVersionCode = (semver.length == 3 && semver.every { it.isInteger() }) ?
        semver[0].toInteger() * 1_000_000 + semver[1].toInteger() * 1_000 + semver[2].toInteger() : 1
}

println("Version Name: $gitVersionName")
println("Version Code: $gitVersionCode")

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('/opt/key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.1'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option "lite"
                }
            }
        }
    }
}

android {
    namespace 'com.tsutsen.platformplayer'
    compileSdk 37
    flavorDimensions "buildType"
    productFlavors {
        stable {
            dimension "buildType"
            applicationId "com.tsutsen.platformplayer"
            buildConfigField "boolean", "IS_UNSTABLE_BUILD", "false"
            buildConfigField "boolean", "IS_PLAYSTORE_BUILD", "false"
            resValue "string", "app_name", "Bluejay"
            resValue "string", "authority", "com.tsutsen.platformplayer"
        }
        unstable {
            dimension "buildType"
            applicationId "com.tsutsen.platformplayer.d"
            buildConfigField "boolean", "IS_UNSTABLE_BUILD", "true"
            buildConfigField "boolean", "IS_PLAYSTORE_BUILD", "false"
            resValue "string", "app_name", "Bluejay"
            resValue "string", "authority", "com.tsutsen.platformplayer.d"
            getIsDefault().set(true)
        }
        playstore {
            dimension "buildType"
            applicationId "com.tsutsen.platformplayer.playstore"
            buildConfigField "boolean", "IS_UNSTABLE_BUILD", "false"
            buildConfigField "boolean", "IS_PLAYSTORE_BUILD", "true"
            resValue "string", "app_name", "Bluejay"
            resValue "string", "authority", "com.tsutsen.platformplayer.playstore"
        }
    }

    defaultConfig {
        minSdk 28
        targetSdk 36
        versionCode gitVersionCode
        versionName gitVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
        }
    }

    splits {
        abi {
            enable true
            reset()

            include "x86", "x86_64", "arm64-v8a", "armeabi-v7a"
            universalApk true
        }
    }
    buildFeatures {
        buildConfig true
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets {
                srcDirs 'src/main/assets'
            }
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.13.0'

    //Hilt Dependency Injection
    implementation 'com.google.dagger:hilt-android:2.60.1'
    ksp 'com.google.dagger:hilt-android-compiler:2.60.1'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

    //Core Modules
    implementation project(':core:model')
    implementation project(':core:data')
    implementation project(':core:datastore')
    implementation project(':core:database')
    implementation project(':core:designsystem')
    implementation project(':core:navigation')
    implementation project(':core:ui')
    implementation project(':feature:home:impl')
    implementation project(':feature:subscriptions:impl')
    implementation project(':feature:settings:impl')
    implementation project(':feature:search:impl')
    implementation project(':feature:library:impl')
    implementation project(':feature:channel:impl')
    implementation project(':feature:player:impl')

    //Core
    implementation 'androidx.core:core-ktx:1.18.0'
    // Jetpack PiP (alpha): unified PiP events + validated params.
    implementation 'androidx.core:core-pip:1.0.0-alpha02'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'

    //Preferences (DataStore for appearance settings)
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    //Async
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    //HTTP
    implementation "com.squareup.okhttp3:okhttp:5.3.0"

    //JSON
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0" //Used for structured json
    implementation 'com.google.code.gson:gson:2.13.2' //Used for complex/anonymous cases like during development conversions (eg. V8RemoteObject)

    //JS
    implementation 'com.caoccao.javet:javet-v8-android:4.1.5'

    //Exoplayer
    implementation 'androidx.media3:media3-exoplayer:1.9.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.9.0'
    implementation 'androidx.media3:media3-ui:1.9.0'
    implementation 'androidx.media3:media3-ui-compose:1.9.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.9.0'
    implementation 'androidx.media3:media3-datasource:1.9.0'
    implementation 'androidx.media:media:1.7.1' // legacy NotificationCompat.MediaStyle (MediaPlaybackService)

    //Other
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation fileTree(dir: 'aar', include: ['*.aar'])
    implementation 'org.jetbrains.kotlin:kotlin-reflect:2.2.0'
    implementation 'androidx.webkit:webkit:1.15.0'

    //Protobuf
    implementation 'com.google.protobuf:protobuf-javalite:4.33.0'

    implementation 'com.polycentric.core:app:1.0'
    implementation 'com.tsutsen.futopay:app:1.0'
    implementation 'androidx.work:work-runtime-ktx:2.11.0'

    //Database
    implementation("androidx.room:room-runtime:2.8.3")
    ksp("androidx.room:room-compiler:2.8.3")
    implementation("androidx.room:room-ktx:2.8.3")

    //Jetpack Compose (Compose Migration Phase 0+)
    // BOM 2026.05.01 → Compose 1.11.2. Cap: Compose 1.12.0 requires AGP 9.1+ and
    // compileSdk 37, but the dep/* submodules are still on AGP 8.13.
    implementation platform('androidx.compose:compose-bom:2026.05.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-geometry'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-text'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha27'
    implementation 'androidx.compose.material3.adaptive:adaptive'
    implementation 'androidx.compose.material3.adaptive:adaptive-layout'
    implementation 'androidx.compose.material3.adaptive:adaptive-navigation'
    // Material3 adaptive navigation suite (not in BOM — explicit version needed)
    implementation 'androidx.compose.material3:material3-adaptive-navigation-suite-android:1.3.2'
    // Coil for image loading in Compose
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    // material3-android provides PlatformTheme for reading host Activity XML themes
    implementation 'androidx.compose.material3:material3-android'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation "org.jetbrains.kotlin:kotlin-test:2.0.21"
    testImplementation "org.xmlunit:xmlunit-core:2.11.0"
    testImplementation "org.mockito:mockito-core:5.20.0"
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
