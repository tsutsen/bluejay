plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    id 'kotlin-parcelize'
    alias(libs.plugins.ksp)
}

android {
    namespace 'com.tsutsen.platformplayer.core.database'
    compileSdk 37

    defaultConfig {
        minSdk 28
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation project(':core:model')
    implementation libs.androidx.core.ktx
    implementation libs.kotlinx.coroutines.android

    // Room
    // api (not implementation): AppDatabaseProvider exposes AppDatabase
    // (a RoomDatabase subtype) in this module's public API, so consumers
    // calling it need room-runtime on their compile classpath.
    api libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    // Tests (JVM, Robolectric provides the Android runtime for Room)
    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    testImplementation libs.androidx.room.testing
}
